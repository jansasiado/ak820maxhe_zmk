# AK820 Max HE — firmware configuration

# Bluetooth
CONFIG_BT_DEVICE_NAME="AK820 Max HE"

# Hall-effect feature module
CONFIG_ZMK_HE=y

# Stack sizes — increase if you see stack overflow crashes
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_INPUT_THREAD_STACK_SIZE=4096

# Maximum layer name length for ZMK Studio
CONFIG_ZMK_KEYMAP_LAYER_NAME_MAX_LEN=20

# Uncomment to enable USB logging (requires snippet: zmk-usb-logging)
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
